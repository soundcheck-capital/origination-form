name: E2E

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
      REACT_APP_FORM_PASSWORD: "123456"
      REACT_APP_WEBHOOK_URL: "https://webhook.test.com/test"
      REACT_APP_WEBHOOK_URL_FILES: "https://hook.us1.make.com/test-upload"
      REACT_APP_HUBSPOT_COMPANY_ID: "12345"
      REACT_APP_HUBSPOT_DEAL_ID: "67890"
      REACT_APP_HUBSPOT_CONTACT_ID: "11111"
      REACT_APP_HUBSPOT_DRIVE_ID: "test-drive-id"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run prod critical path test
        run: npx playwright test tests/prod-form-critical-path.spec.ts --project=chromium

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
